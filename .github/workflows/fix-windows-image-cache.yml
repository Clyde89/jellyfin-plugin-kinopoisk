name: Временное исправление Windows бинарного кэша

on:
  push:
    branches:
      - feature/self-contained-web-bootstrap

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Добавлен workflow исправления Windows бинарного кэша'
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Получен исходный код
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feature/self-contained-web-bootstrap
          fetch-depth: 0

      - name: Исправлено закрытие временного metadata-файла
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/Jellyfin.Plugin.Kinopoisk/Services/KinopoiskImageBinaryCache.cs')
          text = path.read_text(encoding='utf-8')
          old = '''            try
              {
                  await using var stream = new FileStream(
                      temporaryPath,
                      FileMode.CreateNew,
                      FileAccess.Write,
                      FileShare.None,
                      4096,
                      FileOptions.Asynchronous | FileOptions.SequentialScan);
                  await JsonSerializer.SerializeAsync(
                          stream,
                          metadata,
                          SerializerOptions,
                          CancellationToken.None)
                      .ConfigureAwait(false);
                  await stream.FlushAsync(CancellationToken.None).ConfigureAwait(false);
                  File.Move(temporaryPath, metadataPath, true);
              }
          '''
          new = '''            try
              {
                  await using (var stream = new FileStream(
                      temporaryPath,
                      FileMode.CreateNew,
                      FileAccess.Write,
                      FileShare.None,
                      4096,
                      FileOptions.Asynchronous | FileOptions.SequentialScan))
                  {
                      await JsonSerializer.SerializeAsync(
                              stream,
                              metadata,
                              SerializerOptions,
                              CancellationToken.None)
                          .ConfigureAwait(false);
                      await stream.FlushAsync(CancellationToken.None).ConfigureAwait(false);
                  }

                  File.Move(temporaryPath, metadataPath, true);
              }
          '''
          if text.count(old) != 1:
              raise SystemExit('Ожидаемый блок WriteMetadata не найден однозначно.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Установлен .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 9.0.x

      - name: Проверены сборка и все тесты на Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          dotnet restore src/Jellyfin.Plugin.Kinopoisk.Tests/Jellyfin.Plugin.Kinopoisk.Tests.csproj
          dotnet build src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj `
            --configuration Release `
            --warnaserror
          dotnet test src/Jellyfin.Plugin.Kinopoisk.Tests/Jellyfin.Plugin.Kinopoisk.Tests.csproj `
            --configuration Release `
            --no-restore `
            --warnaserror

      - name: Зафиксировано исправление Windows бинарного кэша
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Jellyfin.Plugin.Kinopoisk/Services/KinopoiskImageBinaryCache.cs
          git commit -m 'Исправлена атомарная запись бинарного кэша в Windows'
          git push origin HEAD:feature/self-contained-web-bootstrap
