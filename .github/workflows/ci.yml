name: Проверка сборки

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Сборка и тесты
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Получен исходный код
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1

      - name: Установлен .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 9.0.x

      - name: Проверена версия .NET SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          dotnet --info

          sdk_version="$(dotnet --version)"

          if [[ "$sdk_version" != 9.0.* ]]; then
            echo "Ожидался .NET SDK 9.0.x, получен ${sdk_version}." >&2
            exit 1
          fi

      - name: Восстановлены зависимости плагина
        run: >-
          dotnet restore
          src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj

      - name: Восстановлены зависимости тестов API
        run: >-
          dotnet restore
          src/KinopoiskUnofficialInfo.ApiClient.Tests/KinopoiskUnofficialInfo.ApiClient.Tests.csproj

      - name: Восстановлены зависимости тестов плагина
        run: >-
          dotnet restore
          src/Jellyfin.Plugin.Kinopoisk.Tests/Jellyfin.Plugin.Kinopoisk.Tests.csproj

      - name: Собран плагин
        run: >-
          dotnet build
          src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj
          --configuration Release
          --no-restore
          --verbosity normal

      - name: Выполнены тесты API
        run: >-
          dotnet test
          src/KinopoiskUnofficialInfo.ApiClient.Tests/KinopoiskUnofficialInfo.ApiClient.Tests.csproj
          --configuration Release
          --no-restore
          --verbosity normal

      - name: Выполнены тесты плагина
        run: >-
          dotnet test
          src/Jellyfin.Plugin.Kinopoisk.Tests/Jellyfin.Plugin.Kinopoisk.Tests.csproj
          --configuration Release
          --no-restore
          --verbosity normal

      - name: Проверен синтаксис клиентских модулей
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -d '' scripts < <(
            find src/Jellyfin.Plugin.Kinopoisk/Web \
              -maxdepth 1 \
              -type f \
              -name '*.js' \
              -print0 \
              | sort -z
          )
          test "${#scripts[@]}" -gt 0
          for script in "${scripts[@]}"; do
            node --check "$script"
          done

      - name: Рассчитаны контрольные суммы
        shell: bash
        run: |
          set -Eeuo pipefail

          output_dir="src/Jellyfin.Plugin.Kinopoisk/bin/Release/net9.0"
          plugin_dll="${output_dir}/Jellyfin.Plugin.Kinopoisk.dll"
          api_client_dll="${output_dir}/KinopoiskUnofficialInfo.ApiClient.dll"

          test -f "$plugin_dll"
          test -f "$api_client_dll"

          sha256sum \
            "$plugin_dll" \
            "$api_client_dll"

      - name: Опубликована тестовая сборка
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kinopoisk-plugin-${{ github.sha }}
          path: |
            src/Jellyfin.Plugin.Kinopoisk/bin/Release/net9.0/Jellyfin.Plugin.Kinopoisk.dll
            src/Jellyfin.Plugin.Kinopoisk/bin/Release/net9.0/Jellyfin.Plugin.Kinopoisk.pdb
            src/Jellyfin.Plugin.Kinopoisk/bin/Release/net9.0/KinopoiskUnofficialInfo.ApiClient.dll
            src/Jellyfin.Plugin.Kinopoisk/bin/Release/net9.0/KinopoiskUnofficialInfo.ApiClient.pdb
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
