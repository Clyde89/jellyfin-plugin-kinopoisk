name: Проверка сборки

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Сборка и тесты
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, kinopoisk-ci]
    timeout-minutes: 30

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_XMLDOC_MODE: skip
      TZ: UTC

    defaults:
      run:
        working-directory: ${{ github.workspace }}/kinopoisk-ci-source

    steps:
      - name: Получены исходники через Git
        working-directory: ${{ github.workspace }}
        timeout-minutes: 4
        shell: bash
        run: |
          set -Eeuo pipefail
          source_dir="${RUNNER_TEMP}/kinopoisk-source"
          mkdir -p "$source_dir"
          git -C "$source_dir" init --quiet
          git -C "$source_dir" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$source_dir" -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=30 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$GITHUB_SHA"
          source_link="${GITHUB_WORKSPACE}/kinopoisk-ci-source"
          if [[ -L "$source_link" ]]; then
            test "$(readlink "$source_link")" = "$source_dir"
            unlink "$source_link"
          fi
          test ! -e "$source_link"
          ln -s "$source_dir" "$source_link"
          upload_dir="${GITHUB_WORKSPACE}/kinopoisk-upload-action"
          upload_sha=043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
          if [[ ! -d "${upload_dir}/.git" ]]; then
            test ! -e "$upload_dir"
            mkdir -p "$upload_dir"
            git -C "$upload_dir" init --quiet
            git -C "$upload_dir" remote add origin https://github.com/actions/upload-artifact.git
          fi
          test "$(git -C "$upload_dir" remote get-url origin)" = https://github.com/actions/upload-artifact.git
          if [[ "$(git -C "$upload_dir" rev-parse --verify HEAD 2>/dev/null || true)" != "$upload_sha" ]]; then
            git -C "$upload_dir" -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=30 fetch --no-tags --depth=1 origin "$upload_sha"
          fi
          git -C "$upload_dir" checkout --quiet --force --detach "$upload_sha"
          test "$(git -C "$upload_dir" rev-parse HEAD)" = "$upload_sha"

      - name: Подключён .NET SDK
        timeout-minutes: 7
        shell: bash
        run: |
          set -Eeuo pipefail
          sdk_dir="${RUNNER_WORKSPACE}/../kinopoisk-tools/dotnet"
          mkdir -p "$sdk_dir"
          if [[ ! -x "${sdk_dir}/dotnet" ]] || ! "${sdk_dir}/dotnet" --list-sdks | grep -q '^10\.0\.402 '; then
            curl --fail --show-error --silent --location --max-time 60 \
              https://dot.net/v1/dotnet-install.sh --output "${RUNNER_TEMP}/install-dotnet.sh"
            bash "${RUNNER_TEMP}/install-dotnet.sh" --version 10.0.402 \
              --install-dir "$sdk_dir" --no-path \
              --azure-feed https://dotnetcli.blob.core.windows.net/dotnet
          fi
          echo "$sdk_dir" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$sdk_dir" >> "$GITHUB_ENV"

      - name: Подключены Node.js runner и npm
        timeout-minutes: 3
        shell: bash
        run: |
          set -Eeuo pipefail
          runner_node_bin="$(dirname "$RUNNER_TEMP")/../externals/node24/bin"
          test -x "${runner_node_bin}/node"
          export PATH="${runner_node_bin}:${PATH}"
          echo "$runner_node_bin" >> "$GITHUB_PATH"
          node -e 'if(Number(process.versions.node.split(".")[0]) < 24) process.exit(1)'
          if ! npm --version >/dev/null 2>&1; then
            npm_dir="${RUNNER_TEMP}/kinopoisk-npm"
            npm_bin="${RUNNER_TEMP}/kinopoisk-npm-bin"
            mkdir -p "$npm_dir" "$npm_bin"
            curl --fail --show-error --silent --location --max-time 90 \
              https://registry.npmjs.org/npm/-/npm-11.6.2.tgz --output "${RUNNER_TEMP}/npm.tgz"
            tar -xzf "${RUNNER_TEMP}/npm.tgz" --strip-components=1 -C "$npm_dir"
            ln -s "${npm_dir}/bin/npm-cli.js" "${npm_bin}/npm"
            ln -s "${npm_dir}/bin/npx-cli.js" "${npm_bin}/npx"
            export PATH="${npm_bin}:${PATH}"
            echo "$npm_bin" >> "$GITHUB_PATH"
          fi
          node --version
          npm --version

      - name: Проверена версия .NET SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          dotnet --info

          sdk_version="$(dotnet --version)"

          if [[ "$sdk_version" != 10.0.* ]]; then
            echo "Ожидался .NET SDK 10.0.x, получен ${sdk_version}." >&2
            exit 1
          fi

      - name: Восстановлены зависимости плагина
        run: >-
          dotnet restore
          src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj

      - name: Восстановлены зависимости тестов API
        run: >-
          dotnet restore
          src/KinopoiskUnofficialInfo.ApiClient.Tests/KinopoiskUnofficialInfo.ApiClient.Tests.csproj

      - name: Восстановлены зависимости тестов плагина
        run: >-
          dotnet restore
          src/Jellyfin.Plugin.Kinopoisk.Tests/Jellyfin.Plugin.Kinopoisk.Tests.csproj

      - name: Собран плагин
        run: >-
          dotnet build
          src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj
          --configuration Release
          --no-restore
          --verbosity normal

      - name: Выполнены тесты API
        run: >-
          dotnet test
          src/KinopoiskUnofficialInfo.ApiClient.Tests/KinopoiskUnofficialInfo.ApiClient.Tests.csproj
          --configuration Release
          --no-restore
          --verbosity normal

      - name: Выполнены тесты плагина
        run: >-
          dotnet test
          src/Jellyfin.Plugin.Kinopoisk.Tests/Jellyfin.Plugin.Kinopoisk.Tests.csproj
          --configuration Release
          --no-restore
          --verbosity normal

      - name: Проверен синтаксис клиентских модулей
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -d '' scripts < <(
            find src/Jellyfin.Plugin.Kinopoisk/Web \
              -maxdepth 1 \
              -type f \
              -name '*.js' \
              -print0 \
              | sort -z
          )
          test "${#scripts[@]}" -gt 0
          for script in "${scripts[@]}"; do
            node --check "$script"
          done

      - name: Восстановлены зависимости DOM-тестов
        run: npm ci --ignore-scripts

      - name: Выполнены DOM-тесты клиентской карточки
        run: npm run test:web

      - name: Подготовлен браузер для проверки карточек
        timeout-minutes: 5
        shell: bash
        run: |
          set -Eeuo pipefail
          tool_cache="${RUNNER_WORKSPACE}/../kinopoisk-tools"
          browser_tools="${tool_cache}/browser-tools-1.56.1-1.102.0"
          if [[ ! -f "${browser_tools}/.ready" ]]; then
            npm install --prefix "$browser_tools" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1 sass@1.102.0
            touch "${browser_tools}/.ready"
          fi
          export PLAYWRIGHT_BROWSERS_PATH="${tool_cache}/playwright-browsers"
          "${browser_tools}/node_modules/.bin/playwright" install chromium --only-shell
          echo "NODE_PATH=${browser_tools}/node_modules" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=${PLAYWRIGHT_BROWSERS_PATH}" >> "$GITHUB_ENV"
          style_dir="${RUNNER_TEMP}/jellyfin-native-styles"
          mkdir -p "$style_dir"
          upstream=https://raw.githubusercontent.com/jellyfin/jellyfin-web/ee8efb417e5377ba444509a68ed22af33e45950b
          curl --fail --show-error --silent --location "$upstream/src/components/cardbuilder/card.scss" --output "$style_dir/card.scss"
          curl --fail --show-error --silent --location "$upstream/src/elements/emby-button/emby-button.scss" --output "$style_dir/emby-button.scss"
          curl --fail --show-error --silent --location "$upstream/src/components/dialogHelper/dialoghelper.scss" --output "$style_dir/dialoghelper.scss"
          curl --fail --show-error --silent --location "$upstream/src/components/shortcuts.js" --output "$style_dir/shortcuts.js"
          curl --fail --show-error --silent --location "$upstream/src/constants/itemAction.ts" --output "$style_dir/itemAction.ts"
          # Native carousel geometry, controls and theme are part of the UI fixture.
          for native_path in \
            styles/_mixins.scss styles/librarybrowser.scss styles/scrollstyles.scss \
            themes/_base/_theme.scss themes/_base/_palette.scss \
            elements/emby-scroller/emby-scroller.scss elements/emby-scroller/emby-scroller.js \
            elements/emby-scrollbuttons/emby-scrollbuttons.scss elements/emby-scrollbuttons/emby-scrollbuttons.js \
            elements/emby-scrollbuttons/utils.ts lib/scroller/index.js; do
            mkdir -p "${style_dir}/$(dirname "$native_path")"
            curl --fail --show-error --silent --location "$upstream/src/$native_path" --output "${style_dir}/$native_path"
          done
          icon_archive="${style_dir}/icons.tgz"
          curl --fail --show-error --silent --location https://registry.npmjs.org/material-design-icons-iconfont/-/material-design-icons-iconfont-6.7.0.tgz --output "$icon_archive"
          python3 - "$icon_archive" <<'PY'
          import base64, hashlib, pathlib, sys
          expected = 'lSj71DgVv20kO0kGbs42icDzbRot61gEDBLQACzkUuznRQBUYmbxzEkGU6dNBb5fRWHMaScYlAXX96HQ4/cJWA=='
          assert hashlib.sha512(pathlib.Path(sys.argv[1]).read_bytes()).digest() == base64.b64decode(expected)
          PY
          tar -xOf "$icon_archive" package/dist/fonts/MaterialIcons-Regular.woff2 > "${style_dir}/MaterialIcons-Regular.woff2"
          tar -xOf "$icon_archive" package/dist/material-design-icons.css > "${style_dir}/material-design-icons.css"
          echo "JELLYFIN_STYLE_DIR=${style_dir}" >> "$GITHUB_ENV"

      - name: Подготовлены библиотеки браузера без изменения системы
        timeout-minutes: 8
        shell: bash
        run: |
          set -Eeuo pipefail
          tool_cache="${RUNNER_WORKSPACE}/../kinopoisk-tools"
          package_dir="${tool_cache}/browser-packages-noble"
          runtime_dir="${tool_cache}/browser-runtime-noble-1.56.1"
          mkdir -p "${package_dir}/archives/partial" "${runtime_dir}/usr/lib"
          if [[ ! -f "${runtime_dir}/.ready" ]]; then
            # Playwright 1.56.1 nativeDeps.ts, ubuntu24.04-x64/chromium.
            apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 -o Debug::NoLocking=true -o "Dir::Cache=${package_dir}" \
              -o "Dir::Cache::archives=${package_dir}/archives" \
              -o "Dir::State::extended_states=${package_dir}/extended_states" \
              --yes --download-only --no-install-recommends install \
              libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 \
              libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 \
              libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 \
              libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2 fonts-liberation
            shopt -s nullglob
            for package in "${package_dir}/archives/"*.deb; do
              dpkg-deb --extract "$package" "$runtime_dir"
            done
            touch "${runtime_dir}/.ready"
          fi
          library_dirs="$(find "${runtime_dir}/usr/lib" -type d -print | sort | paste -sd: -)"
          echo "LD_LIBRARY_PATH=${library_dirs}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "$GITHUB_ENV"

      - name: Проверены полный клиентский bundle и штатное оформление Jellyfin
        timeout-minutes: 3
        run: node tests/browser/recommendations.cjs

      - name: Сохранены изображения карточек
        if: always()
        uses: ./kinopoisk-upload-action
        with:
          name: kinopoisk-cards-${{ github.sha }}
          path: ${{ runner.temp }}/kinopoisk-source/artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Подготовлен FFmpeg для автономных проверок
        timeout-minutes: 8
        shell: bash
        run: |
          set -Eeuo pipefail
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            exit 0
          fi
          tool_cache="${RUNNER_WORKSPACE}/../kinopoisk-tools"
          package_dir="${tool_cache}/ffmpeg-packages-noble"
          runtime_dir="${tool_cache}/ffmpeg-runtime-noble"
          mkdir -p "${package_dir}/archives/partial" "$runtime_dir"
          if [[ ! -f "${runtime_dir}/.ready" ]]; then
            apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 -o Debug::NoLocking=true \
              -o "Dir::Cache=${package_dir}" \
              -o "Dir::Cache::archives=${package_dir}/archives" \
              -o "Dir::State::extended_states=${package_dir}/extended_states" \
              --yes --download-only --no-install-recommends install ffmpeg
            for package in "${package_dir}/archives/"*.deb; do
              dpkg-deb --extract "$package" "$runtime_dir"
            done
            touch "${runtime_dir}/.ready"
          fi
          library_dirs="$(find "${runtime_dir}/usr/lib" -type d -print | sort | paste -sd: -)"
          export LD_LIBRARY_PATH="${library_dirs}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          "${runtime_dir}/usr/bin/ffmpeg" -version
          "${runtime_dir}/usr/bin/ffprobe" -version
          echo "${runtime_dir}/usr/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Проверены установка systemd и автоматический откат
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tools/systemd -p 'test_*.py' -v

      - name: Рассчитаны контрольные суммы
        shell: bash
        run: |
          set -Eeuo pipefail

          output_dir="src/Jellyfin.Plugin.Kinopoisk/bin/Release/net10.0"
          plugin_dll="${output_dir}/Jellyfin.Plugin.Kinopoisk.dll"
          api_client_dll="${output_dir}/KinopoiskUnofficialInfo.ApiClient.dll"

          test -f "$plugin_dll"
          test -f "$api_client_dll"

          sha256sum \
            "$plugin_dll" \
            "$api_client_dll"

      - name: Подготовлен установочный архив кандидата
        if: contains(github.ref_name, 'runtime-review')
        run: python3 tools/ci/package-review.py

      - name: Сохранён установочный архив кандидата
        if: contains(github.ref_name, 'runtime-review')
        uses: ./kinopoisk-upload-action
        with:
          name: kinopoisk-12.1.0.6-review.7-systemd
          path: ${{ runner.temp }}/kinopoisk-source/artifacts/kinopoisk-*-systemd.zip
          if-no-files-found: error
          retention-days: 7

      - name: Опубликована тестовая сборка
        uses: ./kinopoisk-upload-action
        with:
          name: kinopoisk-plugin-${{ github.sha }}
          path: |
            ${{ runner.temp }}/kinopoisk-source/src/Jellyfin.Plugin.Kinopoisk/bin/Release/net10.0/Jellyfin.Plugin.Kinopoisk.dll
            ${{ runner.temp }}/kinopoisk-source/src/Jellyfin.Plugin.Kinopoisk/bin/Release/net10.0/Jellyfin.Plugin.Kinopoisk.pdb
            ${{ runner.temp }}/kinopoisk-source/src/Jellyfin.Plugin.Kinopoisk/bin/Release/net10.0/KinopoiskUnofficialInfo.ApiClient.dll
            ${{ runner.temp }}/kinopoisk-source/src/Jellyfin.Plugin.Kinopoisk/bin/Release/net10.0/KinopoiskUnofficialInfo.ApiClient.pdb
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
