name: Временная проверка Base URL Runtime Web Bootstrap

on:
  push:
    branches:
      - feature/self-contained-web-bootstrap

permissions:
  contents: read

jobs:
  probe:
    if: github.event.head_commit.message == 'Добавлена отдельная проверка Base URL Web Bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Получен исходный код
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Установлен .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 9.0.x

      - name: Собран плагин
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet restore src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj
          dotnet build \
            src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj \
            --configuration Release \
            --no-restore \
            --warnaserror

      - name: Подготовлена конфигурация Base URL
        shell: bash
        run: |
          set -Eeuo pipefail

          config_dir="$RUNNER_TEMP/baseurl-config"
          cache_dir="$RUNNER_TEMP/baseurl-cache"
          plugin_dir="$config_dir/plugins/КиноПоиск_10.11.0.5"
          configuration_dir="$config_dir/plugins/configurations"
          server_config_dir="$config_dir/config"
          mkdir -p "$plugin_dir" "$configuration_dir" "$server_config_dir" "$cache_dir"

          output_dir='src/Jellyfin.Plugin.Kinopoisk/bin/Release/net9.0'
          cp "$output_dir/Jellyfin.Plugin.Kinopoisk.dll" "$plugin_dir/"
          cp "$output_dir/KinopoiskUnofficialInfo.ApiClient.dll" "$plugin_dir/"

          cat > "$plugin_dir/meta.json" <<'JSON'
          {
            "category": "Metadata",
            "guid": "33e6d249-648f-44cd-a9ce-497be06c08df",
            "name": "КиноПоиск",
            "owner": "Clyde89; LinFor; skrashevich",
            "targetAbi": "10.11.0.0",
            "timestamp": "2026-08-07T00:00:00Z",
            "version": "10.11.0.5",
            "status": "Active",
            "autoUpdate": false
          }
          JSON

          cat > "$configuration_dir/Jellyfin.Plugin.Kinopoisk.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <PluginConfiguration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">
            <ApiToken>baseurl-probe-token</ApiToken>
            <EnableQuotaMonitoring>false</EnableQuotaMonitoring>
          </PluginConfiguration>
          XML

          cat > "$server_config_dir/network.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <NetworkConfiguration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">
            <BaseUrl>/jellyfin</BaseUrl>
          </NetworkConfiguration>
          XML

          chmod -R a+rX,u+w "$config_dir" "$cache_dir"
          echo "TEST_CONFIG=${config_dir}" >> "$GITHUB_ENV"
          echo "TEST_CACHE=${cache_dir}" >> "$GITHUB_ENV"

      - name: Запущен Jellyfin с Base URL
        shell: bash
        run: |
          set -Eeuo pipefail

          docker run -d \
            --name kinopoisk-baseurl-test \
            -p 127.0.0.1:18096:8096 \
            -v "$TEST_CONFIG:/config" \
            -v "$TEST_CACHE:/cache" \
            jellyfin/jellyfin:10.11.11

          for attempt in $(seq 1 120); do
            health="$(curl -fsS --max-time 2 \
              http://127.0.0.1:18096/jellyfin/health 2>/dev/null \
              | tr -d '\r\n"[:space:]' || true)"
            if [[ "$health" == 'Healthy' ]] \
              && docker logs kinopoisk-baseurl-test 2>&1 \
                | grep -Fq 'Runtime Web Bootstrap КиноПоиска зарегистрирован в HTTP pipeline Jellyfin.'; then
              echo "Jellyfin с Base URL готов: попытка ${attempt}/120"
              exit 0
            fi
            sleep 1
          done

          docker logs kinopoisk-baseurl-test >&2 || true
          exit 1

      - name: Проверен Base URL
        shell: bash
        run: |
          set -Eeuo pipefail

          curl -fsS \
            -D "$RUNNER_TEMP/baseurl.headers" \
            -o "$RUNNER_TEMP/baseurl.html" \
            http://127.0.0.1:18096/jellyfin/web/index.html

          test "$(grep -Foc '<!-- KINOPOISK_WEB_CLIENT_BEGIN -->' "$RUNNER_TEMP/baseurl.html" || true)" -eq 1
          test "$(grep -Foc '../Kinopoisk/WebClient.js?v=' "$RUNNER_TEMP/baseurl.html" || true)" -eq 1
          test "$(grep -Foc 'data-kinopoisk-managed="runtime"' "$RUNNER_TEMP/baseurl.html" || true)" -eq 1
          grep -Fi 'X-Kinopoisk-Web-Bootstrap: runtime' "$RUNNER_TEMP/baseurl.headers"

          curl -fsS \
            -D "$RUNNER_TEMP/webclient.headers" \
            -o "$RUNNER_TEMP/WebClient.js" \
            http://127.0.0.1:18096/jellyfin/Kinopoisk/WebClient.js
          grep -Eiq '^Content-Type:[[:space:]]*application/javascript' "$RUNNER_TEMP/webclient.headers"
          grep -F 'Похожие и рекомендации' "$RUNNER_TEMP/WebClient.js" >/dev/null

      - name: Выведен журнал Jellyfin
        if: always()
        shell: bash
        run: |
          docker logs kinopoisk-baseurl-test 2>&1 | tail -n 220 || true
          docker rm -f kinopoisk-baseurl-test >/dev/null 2>&1 || true
