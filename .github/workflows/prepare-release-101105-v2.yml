name: prepare-release-101105-v2

"on":
  push:
    branches:
      - feature/diagnostic-test-mode
    paths:
      - .github/workflows/prepare-release-101105-v2.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feature/diagnostic-test-mode
          fetch-depth: 0

      - name: Подготовлена документация
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/prepare-release-docs-101105.py
          python3 tools/prepare-release-docs-101105.py
          git diff --check

      - name: Зафиксирована документация
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            .github/workflows/prepare-release-101105.yml \
            .github/workflows/prepare-release-101105-v2.yml \
            tools/prepare-release-docs-101105.py
          git add CHANGELOG.md README.md
          git commit -m 'Подготовлена документация первого релиза 10.11.0.5'
          git push origin HEAD:feature/diagnostic-test-mode
