name: Временное исправление постоянной проверки Runtime Web Bootstrap

on:
  push:
    branches:
      - feature/self-contained-web-bootstrap

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Добавлен workflow исправления постоянной проверки Web Bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Получен исходный код
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feature/self-contained-web-bootstrap
          fetch-depth: 0

      - name: Исправлено извлечение версии плагина
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/web-bootstrap-integration.yml')
          text = path.read_text(encoding='utf-8')
          old = "value = root.findtext('.//VersionPrefix')"
          new = "value = root.findtext('.//Version')"
          if text.count(old) != 1:
              raise SystemExit('Ожидалась единственная устаревшая ссылка на VersionPrefix.')
          text = text.replace(old, new, 1)
          text = text.replace(
              "raise SystemExit('VersionPrefix плагина не найден.')",
              "raise SystemExit('Version плагина не найден.')",
              1,
          )
          path.write_text(text, encoding='utf-8')

      - name: Проверена структура workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F "root.findtext('.//Version')" .github/workflows/web-bootstrap-integration.yml
          if grep -Fq 'VersionPrefix' .github/workflows/web-bootstrap-integration.yml; then
            echo 'Устаревшая ссылка VersionPrefix сохранена.' >&2
            exit 1
          fi
          git diff --check

      - name: Зафиксировано исправление постоянной проверки
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/web-bootstrap-integration.yml
          git commit -m 'Исправлено извлечение версии в проверке Web Bootstrap'
          git push origin HEAD:feature/self-contained-web-bootstrap
