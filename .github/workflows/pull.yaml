name: Pull Request Check

on:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_XMLDOC_MODE: skip
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  build:
    name: Сборка автономного кандидата
    runs-on: ubuntu-latest

    steps:
    - name: Получение исходного кода
      uses: actions/checkout@v6

    - name: Настройка .NET 9.0
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 9.0.x

    - name: Восстановление зависимостей
      run: dotnet restore ./src

    - name: Сборка без предупреждений
      run: >-
        dotnet build
        --configuration Release
        --no-restore
        --property:TreatWarningsAsErrors=true
        ./src

    - name: Выполнение тестов
      run: >-
        dotnet test
        --configuration Release
        --no-build
        ./src

    - name: Проверка инструментов развёртывания
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 tools/prepare-kinopoisk-readonly-index.py self-test
        python3 -m py_compile tools/prepare-kinopoisk-readonly-index.py
        bash -n tools/prepare-media-core-readonly.sh
        bash -n tools/test-prepare-media-core-readonly.sh
        bash tools/test-prepare-media-core-readonly.sh

    - name: Определение версии плагина
      id: version
      shell: bash
      run: |
        set -Eeuo pipefail

        project_file="src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj"
        version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' "$project_file" | head -n 1)"

        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Некорректная версия плагина: ${version:-не определена}" >&2
          exit 1
        fi

        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Определена версия плагина: $version"

    - name: Формирование автономного пакета
      id: package
      shell: bash
      run: |
        set -Eeuo pipefail
        umask 077

        version="${{ steps.version.outputs.version }}"
        source_sha="${PR_HEAD_SHA:-$GITHUB_SHA}"
        short_sha="${source_sha:0:12}"
        package_name="kinopoisk-autonomous-web-client-${version}-${short_sha}"
        package_dir="artifacts/${package_name}"
        archive="artifacts/${package_name}.zip"
        checksum="artifacts/${package_name}.zip.sha256"

        mkdir -p "$package_dir"

        cp -- \
          src/Jellyfin.Plugin.Kinopoisk/bin/Release/net9.0/Jellyfin.Plugin.Kinopoisk.dll \
          "$package_dir/"
        cp -- \
          src/KinopoiskUnofficialInfo.ApiClient/bin/Release/net9.0/KinopoiskUnofficialInfo.ApiClient.dll \
          "$package_dir/"
        cp -- \
          tools/prepare-kinopoisk-readonly-index.py \
          tools/prepare-media-core-readonly.sh \
          tools/READONLY-DEPLOYMENT.md \
          "$package_dir/"
        chmod 0755 \
          "$package_dir/prepare-kinopoisk-readonly-index.py" \
          "$package_dir/prepare-media-core-readonly.sh"
        chmod 0644 "$package_dir/READONLY-DEPLOYMENT.md"

        cat > "$package_dir/PACKAGE-INFO.txt" <<EOF
        Автономный тестовый кандидат плагина КиноПоиск
        Версия: ${version}
        HEAD ветки: ${source_sha}
        Commit сборки: ${GITHUB_SHA}

        JavaScript Injector для работы не требуется.
        Клиентский JavaScript хранится внутри DLL и выдаётся через
        Kinopoisk/WebClient.js с ETag и SHA-256.

        В обычной установке с доступным для записи Jellyfin Web плагин может
        идемпотентно подключить endpoint к index.html самостоятельно.

        Для защищённого media-core с read_only: true используется внешний
        управляемый index.html и точечный read-only bind mount. Подготовку без
        перезапуска и без замены DLL выполняет:
          ./prepare-media-core-readonly.sh plan
          ./prepare-media-core-readonly.sh prepare

        Корневой слой контейнера и смонтированный index.html остаются read-only.
        Отдельный JavaScript-файл в Jellyfin Web не создаётся.

        Пакет не запускает docker compose up, Preview, Apply или обновление библиотек.
        Фактическая замена DLL и пересоздание Jellyfin выполняются отдельным
        контролируемым этапом после резервного копирования.
        EOF

        (
          cd "$package_dir"
          sha256sum \
            Jellyfin.Plugin.Kinopoisk.dll \
            KinopoiskUnofficialInfo.ApiClient.dll \
            prepare-kinopoisk-readonly-index.py \
            prepare-media-core-readonly.sh \
            READONLY-DEPLOYMENT.md \
            PACKAGE-INFO.txt \
            > SHA256SUMS
          sha256sum -c SHA256SUMS
        )

        (
          cd "$package_dir"
          zip -9 -r "../${package_name}.zip" .
        )

        (
          cd artifacts
          sha256sum "${package_name}.zip" > "${package_name}.zip.sha256"
          sha256sum -c "${package_name}.zip.sha256"
        )
        unzip -t "$archive"

        test "$(unzip -Z1 "$archive" | grep -c '^Jellyfin.Plugin.Kinopoisk.dll$')" -eq 1
        test "$(unzip -Z1 "$archive" | grep -c '^KinopoiskUnofficialInfo.ApiClient.dll$')" -eq 1
        test "$(unzip -Z1 "$archive" | grep -c '^prepare-kinopoisk-readonly-index.py$')" -eq 1
        test "$(unzip -Z1 "$archive" | grep -c '^prepare-media-core-readonly.sh$')" -eq 1
        test "$(unzip -Z1 "$archive" | grep -c '^READONLY-DEPLOYMENT.md$')" -eq 1
        test "$(unzip -Z1 "$archive" | grep -c '^SHA256SUMS$')" -eq 1
        test "$(unzip -Z1 "$archive" | grep -c '^PACKAGE-INFO.txt$')" -eq 1
        test "$(unzip -Z1 "$archive" | wc -l)" -eq 7

        echo "archive=$archive" >> "$GITHUB_OUTPUT"
        echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

    - name: Публикация автономного пакета
      uses: actions/upload-artifact@v4
      with:
        name: kinopoisk-autonomous-web-client-${{ steps.version.outputs.version }}
        path: |
          ${{ steps.package.outputs.archive }}
          ${{ steps.package.outputs.checksum }}
        if-no-files-found: error
        retention-days: 14
