name: Pull Request Check

on:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_XMLDOC_MODE: skip
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  build:
    name: Сборка автономного кандидата
    runs-on: ubuntu-latest

    steps:
    - name: Получение исходного кода
      uses: actions/checkout@v6

    - name: Настройка .NET 9.0
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 9.0.x

    - name: Восстановление зависимостей
      run: dotnet restore ./src

    - name: Сборка без предупреждений
      run: >-
        dotnet build
        --configuration Release
        --no-restore
        --property:TreatWarningsAsErrors=true
        ./src

    - name: Выполнение тестов
      run: >-
        dotnet test
        --configuration Release
        --no-build
        ./src

    - name: Проверка инструментов развёртывания
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 tools/prepare-kinopoisk-readonly-index.py self-test
        python3 -m py_compile tools/prepare-kinopoisk-readonly-index.py
        bash -n tools/prepare-media-core-readonly.sh
        bash -n tools/install-media-core-autonomous.sh
        bash -n tools/test-prepare-media-core-readonly.sh
        bash -n tools/test-install-media-core-autonomous.sh
        bash tools/test-prepare-media-core-readonly.sh
        bash tools/test-install-media-core-autonomous.sh

    - name: Определение версии плагина
      id: version
      shell: bash
      run: |
        set -Eeuo pipefail

        project_file="src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj"
        version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' "$project_file" | head -n 1)"

        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Некорректная версия плагина: ${version:-не определена}" >&2
          exit 1
        fi

        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Определена версия плагина: $version"

    - name: Формирование автономного пакета
      id: package
      shell: bash
      run: |
        set -Eeuo pipefail
        umask 077

        version="${{ steps.version.outputs.version }}"
        source_sha="${PR_HEAD_SHA:-$GITHUB_SHA}"
        short_sha="${source_sha:0:12}"
        package_name="kinopoisk-autonomous-media-core-${version}-${short_sha}"
        package_dir="artifacts/${package_name}"
        archive="artifacts/${package_name}.zip"
        checksum="artifacts/${package_name}.zip.sha256"

        mkdir -p "$package_dir"

        cp -- \
          src/Jellyfin.Plugin.Kinopoisk/bin/Release/net9.0/Jellyfin.Plugin.Kinopoisk.dll \
          src/Jellyfin.Plugin.Kinopoisk/bin/Release/net9.0/Jellyfin.Plugin.Kinopoisk.pdb \
          src/KinopoiskUnofficialInfo.ApiClient/bin/Release/net9.0/KinopoiskUnofficialInfo.ApiClient.dll \
          src/KinopoiskUnofficialInfo.ApiClient/bin/Release/net9.0/KinopoiskUnofficialInfo.ApiClient.pdb \
          "$package_dir/"
        cp -- \
          tools/prepare-kinopoisk-readonly-index.py \
          tools/prepare-media-core-readonly.sh \
          tools/install-media-core-autonomous.sh \
          tools/READONLY-DEPLOYMENT.md \
          "$package_dir/"
        chmod 0755 \
          "$package_dir/prepare-kinopoisk-readonly-index.py" \
          "$package_dir/prepare-media-core-readonly.sh" \
          "$package_dir/install-media-core-autonomous.sh"
        chmod 0644 \
          "$package_dir/Jellyfin.Plugin.Kinopoisk.dll" \
          "$package_dir/Jellyfin.Plugin.Kinopoisk.pdb" \
          "$package_dir/KinopoiskUnofficialInfo.ApiClient.dll" \
          "$package_dir/KinopoiskUnofficialInfo.ApiClient.pdb" \
          "$package_dir/READONLY-DEPLOYMENT.md"

        cat > "$package_dir/PACKAGE-INFO.txt" <<EOF
        Автономный транзакционный кандидат плагина КиноПоиск
        Версия: ${version}
        HEAD ветки: ${source_sha}
        Commit сборки: ${GITHUB_SHA}

        JavaScript Injector для работы не требуется.
        Клиентский JavaScript хранится внутри DLL и выдаётся через
        Kinopoisk/WebClient.js с ETag и SHA-256.

        Основной установщик для защищённого media-core:
          ./install-media-core-autonomous.sh plan
          ./install-media-core-autonomous.sh apply --confirm
          ./install-media-core-autonomous.sh verify
          ./install-media-core-autonomous.sh rollback --confirm

        Установщик:
        - проверяет SHA-256 всех файлов комплекта;
        - обнаруживает фактически загруженный каталог плагина и /config mount;
        - создаёт точную транзакционную резервную копию и самостоятельный rollback.sh;
        - сохраняет XML-конфигурацию без изменений;
        - создаёт внешний index.html и точечный read-only bind mount;
        - устанавливает отдельный каталог КиноПоиск_${version};
        - пересоздаёт только Jellyfin в Compose-проекте media-core-jellyfin;
        - не затрагивает jellyfin-egress-proxy;
        - проверяет health, Jellyfin 10.11.11, ReadonlyRootfs, mount index.html,
          MIME, ETag, 304, состав WebClient.js и журналы загрузки;
        - подтверждает отсутствие автозапуска Preview и Apply;
        - автоматически выполняет точный откат при критической ошибке.

        Подготовщики prepare-*.sh/.py доступны отдельно для read-only диагностики
        и формирования Web-слоя без замены DLL и без перезапуска контейнера.

        Пакет сам по себе ничего не применяет. Изменения начинаются только после
        явной команды apply --confirm.
        EOF

        (
          cd "$package_dir"
          sha256sum \
            Jellyfin.Plugin.Kinopoisk.dll \
            Jellyfin.Plugin.Kinopoisk.pdb \
            KinopoiskUnofficialInfo.ApiClient.dll \
            KinopoiskUnofficialInfo.ApiClient.pdb \
            prepare-kinopoisk-readonly-index.py \
            prepare-media-core-readonly.sh \
            install-media-core-autonomous.sh \
            READONLY-DEPLOYMENT.md \
            PACKAGE-INFO.txt \
            > SHA256SUMS
          sha256sum -c SHA256SUMS
        )

        (
          cd "$package_dir"
          zip -9 -r "../${package_name}.zip" .
        )

        (
          cd artifacts
          sha256sum "${package_name}.zip" > "${package_name}.zip.sha256"
          sha256sum -c "${package_name}.zip.sha256"
        )
        unzip -t "$archive"

        expected_files=(
          Jellyfin.Plugin.Kinopoisk.dll
          Jellyfin.Plugin.Kinopoisk.pdb
          KinopoiskUnofficialInfo.ApiClient.dll
          KinopoiskUnofficialInfo.ApiClient.pdb
          prepare-kinopoisk-readonly-index.py
          prepare-media-core-readonly.sh
          install-media-core-autonomous.sh
          READONLY-DEPLOYMENT.md
          PACKAGE-INFO.txt
          SHA256SUMS
        )
        for expected_file in "${expected_files[@]}"; do
          test "$(unzip -Z1 "$archive" | grep -Fxc "$expected_file")" -eq 1
        done
        test "$(unzip -Z1 "$archive" | wc -l)" -eq "${#expected_files[@]}"

        echo "archive=$archive" >> "$GITHUB_OUTPUT"
        echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

    - name: Публикация автономного пакета
      uses: actions/upload-artifact@v4
      with:
        name: kinopoisk-autonomous-media-core-${{ steps.version.outputs.version }}
        path: |
          ${{ steps.package.outputs.archive }}
          ${{ steps.package.outputs.checksum }}
        if-no-files-found: error
        retention-days: 14
