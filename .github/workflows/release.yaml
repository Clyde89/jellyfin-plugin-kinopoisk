name: Публикация релиза

on:
  workflow_dispatch:
    inputs:
      version:
        description: Версия плагина в формате X.Y.Z.W
        required: true
        type: string
      target_abi:
        description: Целевая ABI Jellyfin
        required: true
        default: 10.11.0.0
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip
  DIST_ARCHIVES_PATH: dist/kinopoisk
  MANIFEST_FILE: dist/manifest.json

jobs:
  release:
    name: Собран и опубликован релиз
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Получен исходный код
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Установлен .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 9.0.x

      - name: Проверены параметры релиза
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TARGET_ABI: ${{ inputs.target_abi }}
        run: |
          set -Eeuo pipefail

          version_pattern='^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'

          if [[ ! "$VERSION" =~ $version_pattern ]]; then
            echo "Версия должна соответствовать формату X.Y.Z.W: ${VERSION}" >&2
            exit 1
          fi

          if [[ ! "$TARGET_ABI" =~ $version_pattern ]]; then
            echo "ABI должна соответствовать формату X.Y.Z.W: ${TARGET_ABI}" >&2
            exit 1
          fi

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Тег v${VERSION} уже существует." >&2
            exit 1
          fi

          if ! grep -Fqx "## [${VERSION}]" CHANGELOG.md; then
            echo "В CHANGELOG.md отсутствует раздел версии ${VERSION}." >&2
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TARGET_ABI=${TARGET_ABI}" >> "$GITHUB_ENV"

      - name: Подготовлено описание релиза
        shell: bash
        run: |
          set -Eeuo pipefail

          awk -v version="${VERSION}" '
            $0 == "## [" version "]" {
              found = 1
              next
            }
            found && /^## \[/ {
              exit
            }
            found {
              print
            }
            END {
              if (!found) {
                exit 2
              }
            }
          ' CHANGELOG.md > release-notes.md

          sed -i '/./,$!d' release-notes.md
          while [[ -s release-notes.md ]] && [[ -z "$(tail -n 1 release-notes.md | tr -d '[:space:]')" ]]; do
            sed -i '$d' release-notes.md
          done

          if [[ ! -s release-notes.md ]]; then
            echo "Описание релиза для версии ${VERSION} отсутствует." >&2
            exit 1
          fi

      - name: Восстановлены зависимости
        run: |
          dotnet restore src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj
          dotnet restore src/KinopoiskUnofficialInfo.ApiClient.Tests/KinopoiskUnofficialInfo.ApiClient.Tests.csproj
          dotnet restore src/Jellyfin.Plugin.Kinopoisk.Tests/Jellyfin.Plugin.Kinopoisk.Tests.csproj

      - name: Собран плагин
        run: >-
          dotnet build
          src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj
          --configuration Release
          --no-restore
          --property:Version=${VERSION}
          --verbosity normal

      - name: Выполнены тесты API
        run: >-
          dotnet test
          src/KinopoiskUnofficialInfo.ApiClient.Tests/KinopoiskUnofficialInfo.ApiClient.Tests.csproj
          --configuration Release
          --no-restore
          --verbosity normal

      - name: Выполнены тесты плагина
        run: >-
          dotnet test
          src/Jellyfin.Plugin.Kinopoisk.Tests/Jellyfin.Plugin.Kinopoisk.Tests.csproj
          --configuration Release
          --no-restore
          --verbosity normal

      - name: Подготовлен архив релиза
        shell: bash
        run: |
          set -Eeuo pipefail

          output_dir="src/Jellyfin.Plugin.Kinopoisk/bin/Release/net9.0"
          release_filename="jellyfin-plugin-kinopoisk_${VERSION}.zip"
          release_file="${DIST_ARCHIVES_PATH}/${release_filename}"

          mkdir -p "${DIST_ARCHIVES_PATH}"

          test -f "${output_dir}/Jellyfin.Plugin.Kinopoisk.dll"
          test -f "${output_dir}/KinopoiskUnofficialInfo.ApiClient.dll"

          zip --junk-paths "${release_file}" \
            "${output_dir}/Jellyfin.Plugin.Kinopoisk.dll" \
            "${output_dir}/KinopoiskUnofficialInfo.ApiClient.dll"

          unzip -t "${release_file}"

          md5="$(md5sum "${release_file}" | cut -d' ' -f1)"
          sha256="$(sha256sum "${release_file}" | cut -d' ' -f1)"

          {
            echo
            echo "## Контрольные суммы"
            echo
            echo "- MD5: \`${md5}\`"
            echo "- SHA256: \`${sha256}\`"
          } >> release-notes.md

          echo "RELEASE_FILENAME=${release_filename}" >> "$GITHUB_ENV"
          echo "RELEASE_FILE=${release_file}" >> "$GITHUB_ENV"
          echo "RELEASE_MD5=${md5}" >> "$GITHUB_ENV"
          echo "RELEASE_SHA256=${sha256}" >> "$GITHUB_ENV"

      - name: Опубликован GitHub Release
        uses: softprops/action-gh-release@1853d73993c8ca1b2c9c1a7fede39682d0ab5c2a
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: КиноПоиск ${{ env.VERSION }}
          body_path: release-notes.md
          files: ${{ env.RELEASE_FILE }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: true

      - name: Обновлён стабильный manifest.json
        shell: bash
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ env.VERSION }}/${{ env.RELEASE_FILENAME }}
        run: |
          set -Eeuo pipefail

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git fetch origin --prune

          if git show-ref --verify --quiet refs/remotes/origin/release; then
            git worktree add release-worktree origin/release
            git -C release-worktree switch -C release --track origin/release
          else
            git worktree add -b release release-worktree "${GITHUB_SHA}"
          fi

          manifest_path="release-worktree/${MANIFEST_FILE}"
          test -f "${manifest_path}"
          jq empty "${manifest_path}"

          if jq -e --arg version "${VERSION}" '.[0].versions[]? | select(.version == $version)' "${manifest_path}" >/dev/null; then
            echo "Версия ${VERSION} уже присутствует в manifest.json." >&2
            exit 1
          fi

          changelog_json="$(jq -Rs . < release-notes.md)"
          timestamp="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          jq \
            --arg version "${VERSION}" \
            --arg checksum "${RELEASE_MD5}" \
            --argjson changelog "${changelog_json}" \
            --arg target_abi "${TARGET_ABI}" \
            --arg source_url "${SOURCE_URL}" \
            --arg timestamp "${timestamp}" \
            '.[0].versions = [{
              "version": $version,
              "checksum": $checksum,
              "changelog": $changelog,
              "targetAbi": $target_abi,
              "sourceUrl": $source_url,
              "timestamp": $timestamp
            }] + .[0].versions' \
            "${manifest_path}" > "${manifest_path}.tmp"

          mv "${manifest_path}.tmp" "${manifest_path}"
          jq empty "${manifest_path}"

          git -C release-worktree add "${MANIFEST_FILE}"
          git -C release-worktree commit -m "Опубликована версия ${VERSION} в manifest.json [skip ci]"
          git -C release-worktree push origin HEAD:release

      - name: Опубликован архив проверки
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kinopoisk-release-${{ env.VERSION }}
          path: |
            ${{ env.RELEASE_FILE }}
            release-notes.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
