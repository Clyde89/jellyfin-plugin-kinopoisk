name: Публикация релиза

on:
  push:
    branches:
      - develop
    paths:
      - release/version.json
  workflow_dispatch:
    inputs:
      version:
        description: Версия плагина в формате X.Y.Z.W
        required: true
        type: string
      target_abi:
        description: Целевая ABI Jellyfin
        required: true
        default: 12.1.0.0
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip
  TZ: UTC
  DIST_ARCHIVES_PATH: dist/kinopoisk
  MANIFEST_FILE: dist/manifest.json

jobs:
  release:
    name: Собран и опубликован релиз
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, Linux, X64, kinopoisk-ci]
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ${{ github.workspace }}/kinopoisk-release-source

    steps:
      - name: Получены исходники через Git
        working-directory: ${{ github.workspace }}
        timeout-minutes: 4
        shell: bash
        run: |
          set -Eeuo pipefail
          source_dir="${RUNNER_TEMP}/kinopoisk-release-source"
          mkdir -p "$source_dir"
          git -C "$source_dir" init --quiet
          git -C "$source_dir" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$source_dir" -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=30 fetch --tags origin "+refs/heads/*:refs/remotes/origin/*"
          git -C "$source_dir" fetch origin "$GITHUB_SHA"
          git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$GITHUB_SHA"
          source_link="${GITHUB_WORKSPACE}/kinopoisk-release-source"
          if [[ -L "$source_link" ]]; then
            test "$(readlink "$source_link")" = "$source_dir"
            unlink "$source_link"
          fi
          test ! -e "$source_link"
          ln -s "$source_dir" "$source_link"
          upload_dir="${GITHUB_WORKSPACE}/kinopoisk-upload-action"
          upload_sha=043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
          if [[ ! -d "${upload_dir}/.git" ]]; then
            test ! -e "$upload_dir"
            mkdir -p "$upload_dir"
            git -C "$upload_dir" init --quiet
            git -C "$upload_dir" remote add origin https://github.com/actions/upload-artifact.git
          fi
          test "$(git -C "$upload_dir" remote get-url origin)" = https://github.com/actions/upload-artifact.git
          if [[ "$(git -C "$upload_dir" rev-parse --verify HEAD 2>/dev/null || true)" != "$upload_sha" ]]; then
            git -C "$upload_dir" -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=30 fetch --no-tags --depth=1 origin "$upload_sha"
          fi
          git -C "$upload_dir" checkout --quiet --force --detach "$upload_sha"
          test "$(git -C "$upload_dir" rev-parse HEAD)" = "$upload_sha"

          release_action_dir="${GITHUB_WORKSPACE}/kinopoisk-release-action"
          release_action_sha=1853d73993c8ca1b2c9c1a7fede39682d0ab5c2a
          if [[ ! -d "${release_action_dir}/.git" ]]; then
            test ! -e "$release_action_dir"
            mkdir -p "$release_action_dir"
            git -C "$release_action_dir" init --quiet
            git -C "$release_action_dir" remote add origin https://github.com/softprops/action-gh-release.git
          fi
          test "$(git -C "$release_action_dir" remote get-url origin)" = https://github.com/softprops/action-gh-release.git
          git -C "$release_action_dir" -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=30 fetch --no-tags --depth=1 origin "$release_action_sha"
          git -C "$release_action_dir" checkout --quiet --force --detach "$release_action_sha"
          test "$(git -C "$release_action_dir" rev-parse HEAD)" = "$release_action_sha"

      - name: Подключён .NET SDK
        timeout-minutes: 7
        shell: bash
        run: |
          set -Eeuo pipefail
          sdk_dir="${RUNNER_WORKSPACE}/../kinopoisk-tools/dotnet"
          mkdir -p "$sdk_dir"
          if [[ ! -x "${sdk_dir}/dotnet" ]] || ! "${sdk_dir}/dotnet" --list-sdks | grep -q '^10\.0\.402 '; then
            curl --fail --show-error --silent --location --max-time 60 \
              https://dot.net/v1/dotnet-install.sh --output "${RUNNER_TEMP}/install-dotnet.sh"
            bash "${RUNNER_TEMP}/install-dotnet.sh" --version 10.0.402 \
              --install-dir "$sdk_dir" --no-path \
              --azure-feed https://dotnetcli.blob.core.windows.net/dotnet
          fi
          echo "$sdk_dir" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$sdk_dir" >> "$GITHUB_ENV"

      - name: Проверены параметры релиза
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TARGET_ABI: ${{ inputs.target_abi }}
        run: |
          set -Eeuo pipefail

          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            VERSION="$(jq -er '.version' release/version.json)"
            TARGET_ABI="$(jq -er '.targetAbi' release/version.json)"
          fi

          version_pattern='^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'

          if [[ ! "$VERSION" =~ $version_pattern ]]; then
            echo "Версия должна соответствовать формату X.Y.Z.W: ${VERSION}" >&2
            exit 1
          fi

          if [[ ! "$TARGET_ABI" =~ $version_pattern ]]; then
            echo "ABI должна соответствовать формату X.Y.Z.W: ${TARGET_ABI}" >&2
            exit 1
          fi

          if [[ "$TARGET_ABI" != '12.1.0.0' ]]; then
            echo "Для сборки Jellyfin 12.1 требуется ABI 12.1.0.0: ${TARGET_ABI}" >&2
            exit 1
          fi

          grep -Fq '<InformationalVersion>$(Version)</InformationalVersion>' src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj
          project_version="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj)"
          if [[ "$VERSION" != "$project_version" ]]; then
            echo "Версия релиза не совпала с версией проекта." >&2
            exit 1
          fi

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Тег v${VERSION} уже существует." >&2
            exit 1
          fi

          if ! grep -Fqx "## [${VERSION}]" CHANGELOG.md; then
            echo "В CHANGELOG.md отсутствует раздел версии ${VERSION}." >&2
            exit 1
          fi

          release_title="$(python3 -c 'import json,sys; print(json.load(open("release/metadata.json"))["releaseTitle"].format(version=sys.argv[1]))' "$VERSION")"
          echo "RELEASE_TITLE=${release_title}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TARGET_ABI=${TARGET_ABI}" >> "$GITHUB_ENV"

      - name: Подготовлено описание релиза
        shell: bash
        run: |
          set -Eeuo pipefail

          awk -v version="${VERSION}" '
            $0 == "## [" version "]" {
              found = 1
              next
            }
            found && /^## \[/ {
              exit
            }
            found {
              print
            }
            END {
              if (!found) {
                exit 2
              }
            }
          ' CHANGELOG.md > release-notes.md

          sed -i '/./,$!d' release-notes.md
          while [[ -s release-notes.md ]] && [[ -z "$(tail -n 1 release-notes.md | tr -d '[:space:]')" ]]; do
            sed -i '$d' release-notes.md
          done

          if [[ ! -s release-notes.md ]]; then
            echo "Описание релиза для версии ${VERSION} отсутствует." >&2
            exit 1
          fi

      - name: Восстановлены зависимости
        run: |
          dotnet restore src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj
          dotnet restore src/KinopoiskUnofficialInfo.ApiClient.Tests/KinopoiskUnofficialInfo.ApiClient.Tests.csproj
          dotnet restore src/Jellyfin.Plugin.Kinopoisk.Tests/Jellyfin.Plugin.Kinopoisk.Tests.csproj

      - name: Собран плагин
        run: >-
          dotnet build
          src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj
          --configuration Release
          --no-restore
          --property:Version=${VERSION}
          --verbosity normal

      - name: Выполнены тесты API
        run: >-
          dotnet test
          src/KinopoiskUnofficialInfo.ApiClient.Tests/KinopoiskUnofficialInfo.ApiClient.Tests.csproj
          --configuration Release
          --no-restore
          --verbosity normal

      - name: Выполнены тесты плагина
        run: >-
          dotnet test
          src/Jellyfin.Plugin.Kinopoisk.Tests/Jellyfin.Plugin.Kinopoisk.Tests.csproj
          --configuration Release
          --no-restore
          --verbosity normal

      - name: Подготовлен архив релиза
        shell: bash
        run: |
          set -Eeuo pipefail

          output_dir="src/Jellyfin.Plugin.Kinopoisk/bin/Release/net10.0"
          release_filename="jellyfin-plugin-kinopoisk_${VERSION}.zip"
          release_file="${PWD}/${DIST_ARCHIVES_PATH}/${release_filename}"

          mkdir -p "${DIST_ARCHIVES_PATH}"

          test -f "${output_dir}/Jellyfin.Plugin.Kinopoisk.dll"
          test -f "${output_dir}/KinopoiskUnofficialInfo.ApiClient.dll"

          zip --junk-paths "${release_file}" \
            "${output_dir}/Jellyfin.Plugin.Kinopoisk.dll" \
            "${output_dir}/KinopoiskUnofficialInfo.ApiClient.dll"

          unzip -t "${release_file}"

          md5="$(md5sum "${release_file}" | cut -d' ' -f1)"
          sha256="$(sha256sum "${release_file}" | cut -d' ' -f1)"

          printf '%s  %s\n' "$sha256" "$release_filename" > "${release_file}.sha256"

          echo "RELEASE_FILENAME=${release_filename}" >> "$GITHUB_ENV"
          echo "RELEASE_FILE=${release_file}" >> "$GITHUB_ENV"
          echo "RELEASE_MD5=${md5}" >> "$GITHUB_ENV"
          echo "RELEASE_SHA256=${sha256}" >> "$GITHUB_ENV"

      - name: Опубликован GitHub Release
        uses: ./kinopoisk-release-action
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: ${{ runner.temp }}/kinopoisk-release-source/release-notes.md
          files: |
            ${{ env.RELEASE_FILE }}
            ${{ env.RELEASE_FILE }}.sha256
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: true

      - name: Обновлён стабильный каталог плагинов
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ env.VERSION }}/${{ env.RELEASE_FILENAME }}
        run: python3 tools/ci/release_control.py catalog

      - name: Удалены завершённые рабочие ветки
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git fetch origin --tags
          python3 tools/ci/release_control.py cleanup

      - name: Опубликован архив проверки
        uses: ./kinopoisk-upload-action
        with:
          name: kinopoisk-release-${{ env.VERSION }}
          path: |
            ${{ env.RELEASE_FILE }}
            ${{ env.RELEASE_FILE }}.sha256
            ${{ runner.temp }}/kinopoisk-release-source/release-notes.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
