name: Одноразовое обновление runtime-версии

on:
  push:
    branches:
      - feature/diagnostic-test-mode
    paths:
      - .github/workflows/bump-runtime-candidate-version.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-runtime-candidate-version
  cancel-in-progress: false

jobs:
  bump-version:
    name: Обновлена версия runtime-кандидата
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Получен исходный код
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: feature/diagnostic-test-mode

      - name: Проверены и обновлены упоминания версии
        shell: bash
        run: |
          set -Eeuo pipefail

          old_version='10.11.0.1'
          new_version='10.11.0.2'
          project='src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj'
          installer='tools/install-media-core-autonomous.sh'
          integration_test='tools/test-install-media-core-autonomous.sh'
          deployment_guide='tools/READONLY-DEPLOYMENT.md'
          workflow='.github/workflows/bump-runtime-candidate-version.yml'
          allowed=(
            "$project"
            "$installer"
            "$integration_test"
            "$deployment_guide"
          )

          if grep -Fq "<Version>${new_version}</Version>" "$project"; then
            echo "Версия ${new_version} уже установлена; повторные изменения не выполнены."
            exit 0
          fi

          mapfile -t found < <(
            grep -RIl \
              --exclude-dir=.git \
              --exclude='*.dll' \
              --exclude='*.pdb' \
              --exclude="$(basename "$workflow")" \
              -- "$old_version" . \
              | sed 's#^./##' \
              | sort
          )

          printf 'Найдены упоминания %s:\n' "$old_version"
          if (( ${#found[@]} == 0 )); then
            printf '  отсутствуют\n'
          else
            printf '  %s\n' "${found[@]}"
          fi

          unexpected=()
          for path in "${found[@]}"; do
            permitted=false
            for expected in "${allowed[@]}"; do
              if [[ "$path" == "$expected" ]]; then
                permitted=true
                break
              fi
            done
            if [[ "$permitted" != true ]]; then
              unexpected+=("$path")
            fi
          done

          if (( ${#unexpected[@]} > 0 )); then
            printf 'Обнаружены неожиданные упоминания версии:\n' >&2
            printf '  %s\n' "${unexpected[@]}" >&2
            exit 1
          fi

          for path in "${allowed[@]}"; do
            test -f "$path"
            grep -Fq "$old_version" "$path"
            sed -i "s/${old_version//./\\.}/${new_version}/g" "$path"
            if grep -Fq "$old_version" "$path"; then
              echo "Старая версия сохранилась в ${path}." >&2
              exit 1
            fi
          done

          grep -Fq "<Version>${new_version}</Version>" "$project"
          grep -Fq "TARGET_VERSION=\"${new_version}\"" "$installer"
          grep -Fq "КиноПоиск_${new_version}" "$integration_test"
          grep -Fq "Version=${new_version}" "$integration_test"
          grep -Fq "$new_version" "$deployment_guide"

          git diff --check
          git diff -- "${allowed[@]}"

      - name: Зафиксировано обновление версии
        shell: bash
        run: |
          set -Eeuo pipefail

          if git diff --quiet; then
            echo 'Изменения отсутствуют.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj \
            tools/install-media-core-autonomous.sh \
            tools/test-install-media-core-autonomous.sh \
            tools/READONLY-DEPLOYMENT.md
          git commit -m 'Обновлена версия runtime-кандидата до 10.11.0.2'
          git push origin HEAD:feature/diagnostic-test-mode
