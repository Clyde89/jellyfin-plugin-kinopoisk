name: Подготовка кандидата Runtime Bootstrap 10.11.0.6

on:
  push:
    branches:
      - feature/self-contained-web-bootstrap
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-runtime-bootstrap-v101106
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Получен исходный код
        uses: actions/checkout@v6
        with:
          ref: feature/self-contained-web-bootstrap
          fetch-depth: 0

      - name: Обновлён релизный слой Runtime Bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          project = Path('src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj')
          text = project.read_text(encoding='utf-8')
          old = '<Version>10.11.0.5</Version>'
          new = '<Version>10.11.0.6</Version>'
          if text.count(old) != 1:
              raise SystemExit('Версия 10.11.0.5 в csproj найдена не один раз.')
          project.write_text(text.replace(old, new), encoding='utf-8')

          path = Path('tools/install-media-core-autonomous.sh')
          text = path.read_text(encoding='utf-8')

          replacements = []
          replacements.append((
              'PREPARE_SCRIPT="${SCRIPT_DIR}/prepare-media-core-readonly.sh"\nINDEX_TOOL="${SCRIPT_DIR}/prepare-kinopoisk-readonly-index.py"\nCHECKSUM_FILE="${SCRIPT_DIR}/SHA256SUMS"\n\nTARGET_VERSION="10.11.0.5"',
              'CHECKSUM_FILE="${SCRIPT_DIR}/SHA256SUMS"\n\nTARGET_VERSION="10.11.0.6"'))
          replacements.append((
              'apply     Создаёт резервную копию, устанавливает DLL и внешний read-only index.html,\n          пересоздаёт только Jellyfin, проверяет runtime и автоматически откатывает\n          изменения при любой критической ошибке.',
              'apply     Создаёт резервную копию, удаляет legacy bind mount index.html, устанавливает DLL,\n          пересоздаёт только Jellyfin из базового Compose, проверяет Runtime Web Bootstrap\n          и автоматически откатывает изменения при любой критической ошибке.'))
          replacements.append((
              '  [[ -f "$PREPARE_SCRIPT" ]] || fail "Подготовщик media-core отсутствует."\n  [[ -f "$INDEX_TOOL" ]] || fail "Подготовщик index.html отсутствует."\n\n',
              ''))

          old_security = '''verify_container_security() {
            local container_id="$1"
            local inspect_file="$2"
            docker inspect "$container_id" > "$inspect_file"
            python3 - "$inspect_file" "$MANAGED_INDEX" "$WEB_INDEX_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path

          inspect_path, expected_source, expected_target = sys.argv[1:]
          payload = json.loads(Path(inspect_path).read_text(encoding="utf-8"))
          if not payload:
              raise SystemExit("docker inspect не вернул контейнер.")
          container = payload[0]
          if container.get("HostConfig", {}).get("ReadonlyRootfs") is not True:
              raise SystemExit("ReadonlyRootfs контейнера Jellyfin отключён.")
          matching = [m for m in container.get("Mounts", []) if m.get("Destination") == expected_target]
          if len(matching) != 1:
              raise SystemExit(
                  f"Ожидалось одно монтирование index.html в {expected_target}, обнаружено {len(matching)}."
              )
          mount = matching[0]
          if mount.get("Source") != expected_source:
              raise SystemExit("Источник read-only index.html не совпадает с ожидаемым.")
          if mount.get("RW") is not False:
              raise SystemExit("Управляемый index.html смонтирован с правом записи.")
          print("Контейнер: ReadonlyRootfs=true; index.html смонтирован read-only.")
          PY
          }
          '''
          new_security = '''verify_container_security() {
            local container_id="$1"
            local inspect_file="$2"
            docker inspect "$container_id" > "$inspect_file"
            python3 - "$inspect_file" "$WEB_INDEX_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path

          inspect_path, expected_target = sys.argv[1:]
          payload = json.loads(Path(inspect_path).read_text(encoding="utf-8"))
          if not payload:
              raise SystemExit("docker inspect не вернул контейнер.")
          container = payload[0]
          if container.get("HostConfig", {}).get("ReadonlyRootfs") is not True:
              raise SystemExit("ReadonlyRootfs контейнера Jellyfin отключён.")
          matching = [m for m in container.get("Mounts", []) if m.get("Destination") == expected_target]
          if matching:
              sources = ", ".join(str(m.get("Source", "")) for m in matching)
              raise SystemExit(
                  f"Legacy mount index.html всё ещё активен в {expected_target}: {sources}"
              )
          print("Контейнер: ReadonlyRootfs=true; внешний mount index.html отсутствует.")
          PY
          }
          '''
          replacements.append((old_security, new_security))

          old_index = '''  curl -fsS --max-time 15 "$BASE_URL/web/index.html" -o "$index_file"
            python3 "$INDEX_TOOL" check --input "$index_file"

          '''
          new_index = '''  local index_headers_file="$workdir/index.headers"
            local index_etag index_http_code
            curl -fsS --max-time 15 \\
              -D "$index_headers_file" \\
              "$BASE_URL/web/index.html" \\
              -o "$index_file"

            python3 - "$index_headers_file" "$index_file" <<'PY'
          import re
          import sys
          from pathlib import Path

          headers_path, index_path = sys.argv[1:]
          headers = Path(headers_path).read_text(encoding="utf-8", errors="replace")
          html = Path(index_path).read_text(encoding="utf-8")
          required = (
              "<!-- KINOPOISK_WEB_CLIENT_BEGIN -->",
              "<!-- KINOPOISK_WEB_CLIENT_END -->",
              'data-kinopoisk-managed="runtime"',
              "Kinopoisk/WebClient.js?v=",
          )
          for marker in required:
              count = html.count(marker)
              if count != 1:
                  raise SystemExit(f"Runtime-маркер {marker!r} обнаружен {count} раз вместо одного.")
          if re.search(r'data-kinopoisk-managed="external"', html, re.IGNORECASE):
              raise SystemExit("В HTTP-ответе остался legacy external-блок.")
          if not re.search(r"(?im)^x-kinopoisk-web-bootstrap:\s*runtime\s*$", headers):
              raise SystemExit("Ответ index.html не содержит X-Kinopoisk-Web-Bootstrap: runtime.")
          if not re.search(r"(?im)^etag:\s*\"[0-9a-f]{64}\"\s*$", headers):
              raise SystemExit("Ответ index.html не содержит корректный Runtime ETag.")
          print("Runtime index.html: единственный bootstrap-блок, заголовок и ETag подтверждены.")
          PY

            index_etag="$(awk 'BEGIN{IGNORECASE=1} /^ETag:/ {sub(/\r$/, "", $2); print $2; exit}' "$index_headers_file")"
            [[ -n "$index_etag" ]] || fail "Не удалось извлечь Runtime ETag index.html."
            index_http_code="$(
              curl -sS --max-time 15 \\
                -o /dev/null \\
                -w '%{http_code}' \\
                -H "If-None-Match: $index_etag" \\
                "$BASE_URL/web/index.html"
            )"
            [[ "$index_http_code" == "304" ]] \\
              || fail "Условный запрос index.html вернул HTTP $index_http_code вместо 304."
            log "Runtime index.html: условный запрос 304 подтверждён."

          '''
          replacements.append((old_index, new_index))
          replacements.append((
              '  grep -Fq "Автономный веб-клиент КиноПоиска готов" "$log_file" \\
    || fail "В журнале не подтверждена готовность автономного веб-клиента."',
              '  grep -Fq "Runtime Web Bootstrap КиноПоиска зарегистрирован в HTTP pipeline Jellyfin." "$log_file" \\
    || fail "В журнале не подтверждена регистрация Runtime Web Bootstrap."'))

          old_layer = '''apply_readonly_layer() {
            CURRENT_STAGE="Подготовка внешнего read-only index.html"
            JELLYFIN_COMPOSE_FILE="$COMPOSE_FILE" \\
            JELLYFIN_COMPOSE_PROJECT="$COMPOSE_PROJECT" \\
            JELLYFIN_OVERRIDE_FILE="$OVERRIDE_FILE" \\
            JELLYFIN_SERVICE_NAME="$SERVICE_NAME" \\
            JELLYFIN_CONTAINER_NAME="$CONTAINER_NAME" \\
            JELLYFIN_WEB_OVERRIDE_ROOT="$WEB_OVERRIDE_ROOT" \\
              bash "$PREPARE_SCRIPT" prepare
          }

          recreate_jellyfin() {
            CURRENT_STAGE="Пересоздание только Jellyfin"
            compose_with_override config --quiet
            compose_with_override \\
              up -d \\
              --no-deps \\
              --force-recreate \\
              --pull never \\
              "$SERVICE_NAME"
          }
          '''
          new_layer = '''remove_legacy_web_layer() {
            CURRENT_STAGE="Удаление legacy Web bind mount"
            if [[ -f "$OVERRIDE_FILE" ]]; then
              rm -f -- "$OVERRIDE_FILE"
              log "Удалён legacy Compose override: $OVERRIDE_FILE"
            fi
            if [[ -f "$MANAGED_INDEX" ]]; then
              rm -f -- "$MANAGED_INDEX"
              log "Удалён legacy внешний index.html: $MANAGED_INDEX"
            fi
            sync
          }

          recreate_jellyfin() {
            CURRENT_STAGE="Пересоздание только Jellyfin из базового Compose"
            compose_base config --quiet
            compose_base \\
              up -d \\
              --no-deps \\
              --force-recreate \\
              --pull never \\
              "$SERVICE_NAME"
          }
          '''
          replacements.append((old_layer, new_layer))
          replacements.append((
              '''apply --confirm выполнит:
          1. Точную резервную копию текущего каталога плагина, XML, override и index.html.
          2. Создание автономного внешнего index.html и read-only bind mount.
          3. Установку отдельного каталога КиноПоиск_${TARGET_VERSION}.
          4. Пересоздание только сервиса Jellyfin в проекте $COMPOSE_PROJECT.
          5. Проверку health, API, read-only mount, WebClient.js, ETag/304 и журналов.
          6. Автоматический откат при любой критической ошибке.
          ''',
              '''apply --confirm выполнит:
          1. Точную резервную копию текущего каталога плагина, XML, legacy override и index.html.
          2. Удаление legacy external index.html и его Compose override.
          3. Установку отдельного каталога КиноПоиск_${TARGET_VERSION}.
          4. Пересоздание только сервиса Jellyfin из базового Compose проекта $COMPOSE_PROJECT.
          5. Проверку health, API, ReadonlyRootfs, отсутствия mount index.html, Runtime Bootstrap, ETag/304 и журналов.
          6. Автоматический откат с восстановлением прежнего Web-слоя при любой критической ошибке.
          '''))
          replacements.append((
              '  apply_readonly_layer\n  stage_target_plugin\n  recreate_jellyfin',
              '  stage_target_plugin\n  remove_legacy_web_layer\n  recreate_jellyfin'))
          replacements.append((
              'Автономный WebClient: проверен',
              'Runtime Web Bootstrap: проверен'))

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Ожидалось одно совпадение patch-блока, обнаружено {count}: {old[:100]!r}')
              text = text.replace(old, new)

          forbidden = (
              'PREPARE_SCRIPT',
              'INDEX_TOOL',
              'apply_readonly_layer',
              'Создание автономного внешнего index.html и read-only bind mount',
              'index.html смонтирован read-only',
          )
          for value in forbidden:
              if value in text:
                  raise SystemExit(f'После patch остался legacy-маркер: {value}')

          required = (
              'TARGET_VERSION="10.11.0.6"',
              'remove_legacy_web_layer()',
              'compose_base config --quiet',
              'внешний mount index.html отсутствует',
              'X-Kinopoisk-Web-Bootstrap: runtime',
              'Runtime Web Bootstrap КиноПоиска зарегистрирован в HTTP pipeline Jellyfin.',
          )
          for value in required:
              if value not in text:
                  raise SystemExit(f'После patch отсутствует обязательный маркер: {value}')

          path.write_text(text, encoding='utf-8')
          PY

          bash -n tools/install-media-core-autonomous.sh
          grep -Fq '<Version>10.11.0.6</Version>' src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj
          grep -Fq 'TARGET_VERSION="10.11.0.6"' tools/install-media-core-autonomous.sh
          ! grep -Eq 'PREPARE_SCRIPT|INDEX_TOOL|apply_readonly_layer' tools/install-media-core-autonomous.sh

      - name: Зафиксирован релизный слой
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj \
            tools/install-media-core-autonomous.sh
          git diff --cached --check
          git commit -m 'Обновлён Runtime Bootstrap для версии 10.11.0.6'
          git push origin HEAD:feature/self-contained-web-bootstrap
