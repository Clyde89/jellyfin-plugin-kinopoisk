name: Временная runtime-проверка самодостаточного Web Bootstrap

on:
  push:
    branches:
      - feature/self-contained-web-bootstrap

permissions:
  contents: read

jobs:
  probe:
    if: github.event.head_commit.message == 'Добавлена runtime-проверка самодостаточного Web Bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Получен исходный код
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Установлен .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 9.0.x

      - name: Собран плагин
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet restore src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj
          dotnet build \
            src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj \
            --configuration Release \
            --no-restore \
            --warnaserror

      - name: Подготовлен чистый Jellyfin 10.11.11
        shell: bash
        run: |
          set -Eeuo pipefail

          image='jellyfin/jellyfin:10.11.11'
          docker pull "$image"

          stock_hash="$(docker run --rm --entrypoint sha256sum "$image" \
            /jellyfin/jellyfin-web/index.html | awk '{print $1}')"
          echo "STOCK_INDEX_SHA256=${stock_hash}" >> "$GITHUB_ENV"

          config_dir="$RUNNER_TEMP/kinopoisk-jellyfin-config"
          cache_dir="$RUNNER_TEMP/kinopoisk-jellyfin-cache"
          plugin_dir="$config_dir/plugins/КиноПоиск_10.11.0.5"
          mkdir -p "$plugin_dir" "$cache_dir"

          output_dir='src/Jellyfin.Plugin.Kinopoisk/bin/Release/net9.0'
          cp "$output_dir/Jellyfin.Plugin.Kinopoisk.dll" "$plugin_dir/"
          cp "$output_dir/KinopoiskUnofficialInfo.ApiClient.dll" "$plugin_dir/"

          cat > "$plugin_dir/meta.json" <<'JSON'
          {
            "category": "Metadata",
            "changelog": "Runtime Web Bootstrap probe",
            "description": "Runtime Web Bootstrap probe",
            "guid": "33e6d249-648f-44cd-a9ce-497be06c08df",
            "name": "КиноПоиск",
            "overview": "Runtime Web Bootstrap probe",
            "owner": "Clyde89; LinFor; skrashevich",
            "targetAbi": "10.11.0.0",
            "timestamp": "2026-08-07T00:00:00Z",
            "version": "10.11.0.5",
            "status": "Active",
            "autoUpdate": false
          }
          JSON

          chmod -R a+rX,u+w "$config_dir" "$cache_dir"
          echo "JELLYFIN_TEST_CONFIG=${config_dir}" >> "$GITHUB_ENV"
          echo "JELLYFIN_TEST_CACHE=${cache_dir}" >> "$GITHUB_ENV"

      - name: Запущен Jellyfin без модификации jellyfin-web
        shell: bash
        run: |
          set -Eeuo pipefail

          docker run -d \
            --name kinopoisk-bootstrap-test \
            -p 127.0.0.1:18096:8096 \
            -v "$JELLYFIN_TEST_CONFIG:/config" \
            -v "$JELLYFIN_TEST_CACHE:/cache" \
            jellyfin/jellyfin:10.11.11

          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:18096/health >/dev/null 2>&1; then
              echo "Jellyfin готов: попытка ${attempt}/90"
              exit 0
            fi
            sleep 1
          done

          docker logs kinopoisk-bootstrap-test >&2 || true
          exit 1

      - name: Подтверждена загрузка Runtime Web Bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          docker logs kinopoisk-bootstrap-test > "$RUNNER_TEMP/jellyfin.log" 2>&1

          grep -F 'Jellyfin.Plugin.Kinopoisk' "$RUNNER_TEMP/jellyfin.log"
          grep -F 'Runtime Web Bootstrap КиноПоиска зарегистрирован в HTTP pipeline Jellyfin.' \
            "$RUNNER_TEMP/jellyfin.log"

          runtime_hash="$(docker exec kinopoisk-bootstrap-test sha256sum \
            /jellyfin/jellyfin-web/index.html | awk '{print $1}')"
          test "$runtime_hash" = "$STOCK_INDEX_SHA256"

          mounts="$(docker inspect kinopoisk-bootstrap-test --format '{{range .Mounts}}{{println .Destination}}{{end}}')"
          if grep -Fxq '/jellyfin/jellyfin-web/index.html' <<< "$mounts"; then
            echo 'Обнаружен запрещённый bind mount index.html.' >&2
            exit 1
          fi

      - name: Проверен преобразованный index.html
        shell: bash
        run: |
          set -Eeuo pipefail

          curl -fsS \
            -D "$RUNNER_TEMP/index.headers" \
            -o "$RUNNER_TEMP/index.html" \
            http://127.0.0.1:18096/web/index.html

          test "$(grep -Foc '<!-- KINOPOISK_WEB_CLIENT_BEGIN -->' "$RUNNER_TEMP/index.html")" -eq 1
          test "$(grep -Foc '<!-- KINOPOISK_WEB_CLIENT_END -->' "$RUNNER_TEMP/index.html")" -eq 1
          test "$(grep -Foc '../Kinopoisk/WebClient.js?v=' "$RUNNER_TEMP/index.html")" -eq 1
          test "$(grep -Foc 'data-kinopoisk-managed=\"runtime\"' "$RUNNER_TEMP/index.html")" -eq 1
          grep -Fi 'X-Kinopoisk-Web-Bootstrap: runtime' "$RUNNER_TEMP/index.headers"

          runtime_etag="$(awk 'BEGIN{IGNORECASE=1} /^ETag:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$RUNNER_TEMP/index.headers")"
          test -n "$runtime_etag"
          echo "RUNTIME_INDEX_ETAG=${runtime_etag}" >> "$GITHUB_ENV"

      - name: Проверены WebClient.js и conditional GET
        shell: bash
        run: |
          set -Eeuo pipefail

          curl -fsS \
            -D "$RUNNER_TEMP/webclient.headers" \
            -o "$RUNNER_TEMP/WebClient.js" \
            http://127.0.0.1:18096/Kinopoisk/WebClient.js

          grep -Eiq '^Content-Type:[[:space:]]*application/javascript' "$RUNNER_TEMP/webclient.headers"
          grep -Eiq '^ETag:' "$RUNNER_TEMP/webclient.headers"
          grep -Eiq '^X-Content-Type-Options:[[:space:]]*nosniff' "$RUNNER_TEMP/webclient.headers"
          grep -F 'Похожие и рекомендации' "$RUNNER_TEMP/WebClient.js" >/dev/null

          status="$(curl -sS \
            -o "$RUNNER_TEMP/index-304.body" \
            -D "$RUNNER_TEMP/index-304.headers" \
            -H "If-None-Match: $RUNTIME_INDEX_ETAG" \
            -w '%{http_code}' \
            http://127.0.0.1:18096/web/index.html)"
          test "$status" = '304'
          test ! -s "$RUNNER_TEMP/index-304.body"

      - name: Выведен журнал Jellyfin
        if: always()
        shell: bash
        run: |
          docker logs kinopoisk-bootstrap-test 2>&1 | tail -n 250 || true
          docker rm -f kinopoisk-bootstrap-test >/dev/null 2>&1 || true
