name: Временное добавление управления Runtime Web Bootstrap v3

on:
  push:
    branches:
      - feature/self-contained-web-bootstrap

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Устранена shell-зависимость workflow управления Web Bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Получен исходный код
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feature/self-contained-web-bootstrap
          fetch-depth: 0

      - name: Добавлено runtime-управление middleware
        shell: python
        run: |
          import re
          from pathlib import Path

          path = Path('src/Jellyfin.Plugin.Kinopoisk/Services/KinopoiskWebBootstrapMiddleware.cs')
          text = path.read_text(encoding='utf-8')

          logger_field = '        private readonly ILogger<KinopoiskWebBootstrapMiddleware> _logger;\n'
          enabled_field = '        private readonly Func<bool> _isEnabled;\n'
          if enabled_field not in text:
              if text.count(logger_field) != 1:
                  raise SystemExit('Поле logger middleware не найдено однозначно.')
              text = text.replace(logger_field, logger_field + enabled_field, 1)

          constructor_pattern = re.compile(
              r'        public KinopoiskWebBootstrapMiddleware\(\n'
              r'            RequestDelegate next,\n'
              r'            KinopoiskWebBootstrapState state,\n'
              r'            ILogger<KinopoiskWebBootstrapMiddleware> logger\)\n'
              r'        \{\n'
              r'            _next = next \?\? throw new ArgumentNullException\(nameof\(next\)\);\n'
              r'            _state = state \?\? throw new ArgumentNullException\(nameof\(state\)\);\n'
              r'            _logger = logger \?\? throw new ArgumentNullException\(nameof\(logger\)\);\n'
              r'        \}',
              re.MULTILINE,
          )
          replacement = '''        public KinopoiskWebBootstrapMiddleware(
              RequestDelegate next,
              KinopoiskWebBootstrapState state,
              ILogger<KinopoiskWebBootstrapMiddleware> logger)
              : this(next, state, logger, IsConfiguredEnabled)
          {
          }

          internal KinopoiskWebBootstrapMiddleware(
              RequestDelegate next,
              KinopoiskWebBootstrapState state,
              ILogger<KinopoiskWebBootstrapMiddleware> logger,
              Func<bool> isEnabled)
          {
              _next = next ?? throw new ArgumentNullException(nameof(next));
              _state = state ?? throw new ArgumentNullException(nameof(state));
              _logger = logger ?? throw new ArgumentNullException(nameof(logger));
              _isEnabled = isEnabled ?? throw new ArgumentNullException(nameof(isEnabled));
          }'''
          if 'Func<bool> isEnabled)' not in text:
              text, count = constructor_pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit('Конструктор middleware не найден структурно.')

          old_guard = '            if (!ShouldTransform(context.Request))\n'
          new_guard = '            if (!_isEnabled() || !ShouldTransform(context.Request))\n'
          if new_guard not in text:
              if text.count(old_guard) != 1:
                  raise SystemExit('Защитное условие middleware не найдено однозначно.')
              text = text.replace(old_guard, new_guard, 1)

          method_anchor = '        internal static bool ShouldTransform(HttpRequest request)\n'
          policy = (
              '        internal static bool IsConfiguredEnabled()\n'
              '            => Plugin.Instance?.Configuration?.EnableWebBootstrap != false;\n\n'
          )
          if 'internal static bool IsConfiguredEnabled()' not in text:
              if text.count(method_anchor) != 1:
                  raise SystemExit('Точка вставки policy не найдена однозначно.')
              text = text.replace(method_anchor, policy + method_anchor, 1)

          path.write_text(text, encoding='utf-8')

      - name: Добавлено управление на странице параметров
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/Jellyfin.Plugin.Kinopoisk/Configuration/configPage.html')
          text = path.read_text(encoding='utf-8')

          anchor = '                    <h2>Стандартные функции Jellyfin</h2>\n'
          block = '''                    <h2>Веб-интеграция</h2>
              <div class="checkboxContainer checkboxContainer-withDescription">
                  <label><input id="EnableWebBootstrap" type="checkbox" is="emby-checkbox" /><span>Самодостаточная веб-интеграция КиноПоиска</span></label>
                  <div class="fieldDescription checkboxFieldDescription">Runtime Web Bootstrap подключает встроенный WebClient.js к Jellyfin Web в памяти процесса. Файл index.html на диске не изменён.</div>
              </div>
              <div class="kinopoiskStatusCard">
                  <div><strong>Runtime Bootstrap:</strong> <span id="WebBootstrapStatus">ещё не проверялся</span></div>
                  <div><strong>Режим:</strong> <code id="WebBootstrapMode">runtime-http</code></div>
                  <div><strong>Версия bundle:</strong> <code id="WebBootstrapBundleVersion">—</code></div>
                  <div><strong>Преобразовано index.html:</strong> <span id="WebBootstrapTransforms">0</span></div>
                  <div><strong>Ошибки fail-open:</strong> <span id="WebBootstrapFailures">0</span></div>
                  <div><strong>Последний ETag:</strong> <code id="WebBootstrapLastEtag">—</code></div>
              </div>

          '''
          if 'id="EnableWebBootstrap"' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('Точка вставки веб-интеграции не найдена однозначно.')
              text = text.replace(anchor, block + anchor, 1)

          load_anchor = "            setValue('#ApiToken', config.ApiToken, '');\n"
          load_line = "            setCheckbox('#EnableWebBootstrap', config.EnableWebBootstrap, true);\n"
          if load_line not in text:
              if text.count(load_anchor) != 1:
                  raise SystemExit('Точка загрузки EnableWebBootstrap не найдена.')
              text = text.replace(load_anchor, load_anchor + load_line, 1)

          diagnostics_anchor = '            var diagnostics = config.Diagnostics || {};\n'
          status_block = '''            var webBootstrap = config.WebBootstrap || {};
              var webBootstrapStatus = !config.EnableWebBootstrap
                  ? 'выключен администратором'
                  : (webBootstrap.PipelineRegistered ? 'активен' : 'ожидает регистрации pipeline');
              $('#WebBootstrapStatus').text(webBootstrapStatus);
              $('#WebBootstrapMode').text(webBootstrap.Mode || 'runtime-http');
              $('#WebBootstrapBundleVersion').text(webBootstrap.BundleVersion || '—');
              $('#WebBootstrapTransforms').text(webBootstrap.TransformedResponses || 0);
              $('#WebBootstrapFailures').text(webBootstrap.Failures || 0);
              $('#WebBootstrapLastEtag').text(webBootstrap.LastEtag || '—');

          '''
          if 'var webBootstrap = config.WebBootstrap || {};' not in text:
              if text.count(diagnostics_anchor) != 1:
                  raise SystemExit('Точка вывода статуса Web Bootstrap не найдена.')
              text = text.replace(diagnostics_anchor, status_block + diagnostics_anchor, 1)

          save_anchor = "            config.ApiToken = $('#ApiToken').val();\n"
          save_line = "            config.EnableWebBootstrap = $('#EnableWebBootstrap').prop('checked');\n"
          if save_line not in text:
              if text.count(save_anchor) != 1:
                  raise SystemExit('Точка сохранения EnableWebBootstrap не найдена.')
              text = text.replace(save_anchor, save_anchor + save_line, 1)

          path.write_text(text, encoding='utf-8')

      - name: Добавлены тесты выключателя
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/Jellyfin.Plugin.Kinopoisk.Tests/KinopoiskWebBootstrapMiddlewareTests.cs')
          text = path.read_text(encoding='utf-8')
          if not text.startswith('#nullable enable\n'):
              text = '#nullable enable\n\n' + text
          anchor = '        [Fact]\n        public async Task ShouldLeaveUnrelatedRouteUntouched()\n'
          test = '''        [Fact]
              public async Task ShouldLeaveIndexUntouchedWhenBootstrapDisabled()
              {
                  var state = new KinopoiskWebBootstrapState();
                  var middleware = new KinopoiskWebBootstrapMiddleware(
                      async context =>
                      {
                          context.Response.StatusCode = StatusCodes.Status200OK;
                          context.Response.ContentType = "text/html; charset=utf-8";
                          var bytes = Encoding.UTF8.GetBytes(OriginalHtml);
                          context.Response.ContentLength = bytes.Length;
                          await context.Response.Body.WriteAsync(bytes);
                      },
                      state,
                      NullLogger<KinopoiskWebBootstrapMiddleware>.Instance,
                      () => false);
                  var context = CreateContext("/web/index.html");

                  await middleware.InvokeAsync(context);

                  Assert.Equal(OriginalHtml, await ReadResponseAsync(context));
                  Assert.False(context.Response.Headers.ContainsKey("X-Kinopoisk-Web-Bootstrap"));
                  Assert.Equal(0, state.TransformedResponses);
                  Assert.Equal(0, state.Failures);
              }

          '''
          if 'ShouldLeaveIndexUntouchedWhenBootstrapDisabled' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('Точка вставки теста выключателя не найдена.')
              text = text.replace(anchor, test + anchor, 1)
          path.write_text(text, encoding='utf-8')

          status_test = Path('src/Jellyfin.Plugin.Kinopoisk.Tests/KinopoiskWebBootstrapConfigurationTests.cs')
          if not status_test.exists():
              status_test.write_text('''#nullable enable

          using Jellyfin.Plugin.Kinopoisk.Configuration;
          using Jellyfin.Plugin.Kinopoisk.Services;
          using Xunit;

          namespace Jellyfin.Plugin.Kinopoisk.Tests
          {
              public class KinopoiskWebBootstrapConfigurationTests
              {
                  [Fact]
                  public void ShouldEnableRuntimeWebBootstrapByDefault()
                  {
                      var configuration = new PluginConfiguration();

                      Assert.True(configuration.EnableWebBootstrap);
                      Assert.True(configuration.WebBootstrap.Enabled);
                  }

                  [Fact]
                  public void ShouldExposeRuntimeBootstrapSnapshot()
                  {
                      var state = new KinopoiskWebBootstrapState();
                      state.MarkPipelineRegistered();
                      state.RecordSuccess("\\\"kp-test\\\"");
                      var configuration = new PluginConfiguration
                      {
                          EnableWebBootstrap = false
                      };

                      var snapshot = configuration.WebBootstrap;

                      Assert.False(snapshot.Enabled);
                      Assert.True(snapshot.PipelineRegistered);
                      Assert.Equal(1, snapshot.TransformedResponses);
                      Assert.Equal(0, snapshot.Failures);
                      Assert.Equal("\\\"kp-test\\\"", snapshot.LastEtag);
                      Assert.Equal("runtime-http", snapshot.Mode);
                      Assert.NotEmpty(snapshot.BundleVersion);
                  }
              }
          }
          ''', encoding='utf-8')

      - name: Установлен .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 9.0.x

      - name: Проверены сборка и тесты
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          dotnet restore src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj
          dotnet restore src/Jellyfin.Plugin.Kinopoisk.Tests/Jellyfin.Plugin.Kinopoisk.Tests.csproj
          dotnet build src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj \
            --configuration Release --no-restore --warnaserror
          dotnet test src/Jellyfin.Plugin.Kinopoisk.Tests/Jellyfin.Plugin.Kinopoisk.Tests.csproj \
            --configuration Release --no-restore --warnaserror
          python3 - <<'PY'
          from pathlib import Path
          value = Path('src/Jellyfin.Plugin.Kinopoisk/Configuration/configPage.html').read_text(encoding='utf-8')
          required = (
              'id="EnableWebBootstrap"',
              "setCheckbox('#EnableWebBootstrap', config.EnableWebBootstrap, true);",
              "config.EnableWebBootstrap = $('#EnableWebBootstrap').prop('checked');",
              'var webBootstrap = config.WebBootstrap || {};',
          )
          missing = [item for item in required if item not in value]
          if missing:
              raise SystemExit('Не найдены элементы Web Bootstrap: ' + ', '.join(missing))
          PY

      - name: Зафиксировано управление Runtime Web Bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/Jellyfin.Plugin.Kinopoisk/Services/KinopoiskWebBootstrapMiddleware.cs \
            src/Jellyfin.Plugin.Kinopoisk/Configuration/configPage.html \
            src/Jellyfin.Plugin.Kinopoisk.Tests/KinopoiskWebBootstrapMiddlewareTests.cs \
            src/Jellyfin.Plugin.Kinopoisk.Tests/KinopoiskWebBootstrapConfigurationTests.cs
          git commit -m 'Добавлено управление Runtime Web Bootstrap'
          git push origin HEAD:feature/self-contained-web-bootstrap
